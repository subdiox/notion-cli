name: release

# Push a tag like v0.1.3 to build every platform's binary and publish them as a
# GitHub release. Run it by hand (workflow_dispatch) to build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: go test ./...

  build:
    needs: test
    # darwin builds run on macOS so they can be signed and notarized there.
    runs-on: ${{ matrix.goos == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="$(git describe --tags --always)"; fi
          name="notion_${version}_${GOOS}_${GOARCH}"
          exe=notion; [ "$GOOS" = windows ] && exe=notion.exe
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X github.com/subdiox/notion-cli/internal/cli.Version=$version" -o "dist/$name/$exe" ./cmd/notion
          cp README.md LICENSE "dist/$name/"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "BIN=dist/$name/$exe" >> "$GITHUB_ENV"
      # Secrets: MACOS_CERT_P12 (base64 of the Developer ID Application .p12),
      # MACOS_CERT_PASSWORD, and an App Store Connect API key for notarization:
      # ASC_KEY_P8 (contents of AuthKey_<id>.p8), ASC_KEY_ID, ASC_ISSUER_ID.
      - name: Sign and notarize
        if: matrix.goos == 'darwin'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$ASC_KEY_P8" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::error::signing secrets are not set"; exit 1; fi
            echo "::warning::signing secrets are not set; leaving the binary unsigned"; exit 0
          fi
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc"

          codesign --force --options runtime --timestamp --keychain "$kc" \
            -s "Developer ID Application" -i io.github.subdiox.notion-cli "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          ditto -c -k "$BIN" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait --output-format json \
            --key "$RUNNER_TEMP/key.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw "$RUNNER_TEMP/notary.json")"
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" \
              --key "$RUNNER_TEMP/key.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            exit 1
          fi
          # A bare Mach-O binary cannot be stapled; Gatekeeper checks the ticket online.
      - name: Clean up signing keychain
        if: always() && matrix.goos == 'darwin'
        run: |
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/key.p8"
      - name: Package
        env:
          COPYFILE_DISABLE: "1" # no AppleDouble ._ files from macOS tar
        run: |
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$NAME.zip" "$NAME"; else tar czf "$NAME.tar.gz" "$NAME"; fi
          rm -r "$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          # Keep notes of a release that was drafted by hand; otherwise generate them.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber *.tar.gz *.zip checksums.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes *.tar.gz *.zip checksums.txt
          fi
